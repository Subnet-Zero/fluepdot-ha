name: Release

# Veroeffentlicht die Version aus manifest.json als GitHub-Release - daran
# erkennt HACS das Update. Ausloeser: ein Tag wie v1.2.0 oder ein manueller
# Start (dann legt der Workflow den Tag auf dem aktuellen Commit selbst an).
# Titel und Text kommen aus .github/release-notes/<tag>.md (erste Zeile =
# Titel).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version bestimmen
        run: |
          version=$(jq -r .version custom_components/fluepdot/manifest.json)
          tag="v${version}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "${tag}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} passt nicht zu manifest.json (${version})"
            exit 1
          fi
          echo "TAG=${tag}" >> "$GITHUB_ENV"

      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG gibt es schon - nichts zu tun."
            exit 0
          fi
          notes=".github/release-notes/${TAG}.md"
          if [ -f "$notes" ]; then
            title=$(head -n 1 "$notes" | sed 's/^# *//')
            tail -n +2 "$notes" > body.md
            set -- --title "$title" --notes-file body.md
          else
            set -- --title "$TAG" --generate-notes
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" --latest "$@"
